services:
  - type: web
    name: audit-suite
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0

  - type: web
    name: audit-suite-mcp
    runtime: python
    rootDir: mcp_server
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: AUDIT_APP_URL
        sync: false
      - key: AUDIT_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0