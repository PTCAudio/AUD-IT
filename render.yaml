services:
  - type: web
    name: audit-suite
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 180
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: API_KEY
        sync: false
      - key: POSTMARK_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: noreply@ptc-audio.com
      - key: APP_BASE_URL
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0

  - type: web
    name: audit-suite-mcp
    runtime: python
    rootDir: mcp_server
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: AUDIT_APP_URL
        sync: false
      - key: AUDIT_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0