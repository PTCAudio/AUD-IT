<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTC 26-27 Season Calendar</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap');
  :root { --bg:#0c0c0f; --surface:#16161a; --surface2:#1e1e24; --border:#2a2a32; --text:#e0e0e6; --text-dim:#8888a0; --accent:#ff6b35; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  .header { padding:24px 32px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .header h1 { font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:700; color:var(--accent); letter-spacing:-0.5px; }
  .header .subtitle { font-size:13px; color:var(--text-dim); }
  .controls { padding:12px 32px; display:flex; gap:8px; flex-wrap:wrap; border-bottom:1px solid var(--border); align-items:center; }
  .controls label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim); margin-right:4px; }
  .filter-btn { padding:4px 10px; border:1px solid var(--border); border-radius:4px; background:transparent; color:var(--text-dim); font-size:12px; font-family:'DM Sans',sans-serif; cursor:pointer; transition:all 0.15s; }
  .filter-btn:hover { border-color:var(--text-dim); color:var(--text); }
  .filter-btn.active { border-color:var(--accent); color:var(--accent); background:rgba(255,107,53,0.08); }
  .show-chip { padding:4px 10px; border-radius:4px; font-size:12px; font-weight:600; cursor:pointer; border:1px solid; transition:all 0.15s; opacity:0.4; }
  .show-chip.active { opacity:1; }
  .show-chip:hover { opacity:0.85; }
  .view-toggle { margin-left:auto; display:flex; gap:4px; }
  .content { padding:16px 32px 48px; }
  .year-divider { font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:700; color:var(--accent); padding:20px 0 4px; border-bottom:2px solid var(--accent); margin-bottom:12px; opacity:0.7; }
  .year-divider:first-child { padding-top:0; }
  .month-group { margin-bottom:24px; }
  .month-label { font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:700; color:var(--text); padding:8px 0; border-bottom:1px solid var(--border); margin-bottom:8px; position:sticky; top:0; background:var(--bg); z-index:10; }
  .month-label .ml-year { color:var(--text-dim); font-weight:400; margin-left:6px; font-size:12px; }
  .event-row { display:grid; grid-template-columns:80px 1fr; gap:12px; padding:5px 0; border-bottom:1px solid rgba(42,42,50,0.4); align-items:start; }
  .event-date { font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:600; color:var(--text-dim); padding-top:2px; }
  .event-date .ed-dow { font-size:10px; font-weight:400; color:rgba(136,136,160,0.6); }
  .event-items { display:flex; flex-direction:column; gap:3px; }
  .event-item { display:inline-flex; align-items:baseline; gap:8px; font-size:13px; line-height:1.4; }
  .event-show-tag { font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700; padding:1px 6px; border-radius:3px; white-space:nowrap; flex-shrink:0; }
  .event-desc { color:var(--text); }
  .dept-tag { font-size:10px; font-weight:600; padding:1px 5px; border-radius:2px; background:rgba(255,255,255,0.06); color:var(--text-dim); margin-left:4px; }
  .event-row.past-event { opacity:0.35; }
  .event-row.today-event { background:rgba(255,107,53,0.06); border-left:3px solid var(--accent); padding-left:8px; }
  .cal-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
  .cal-month-card { background:var(--surface); border:1px solid var(--border); border-radius:6px; overflow:hidden; }
  .cal-month-header { font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700; padding:8px 12px; background:var(--surface2); color:var(--accent); border-bottom:1px solid var(--border); }
  .cal-month-body { padding:8px 12px; }
  .cal-day { display:grid; grid-template-columns:28px 1fr; gap:6px; padding:3px 0; border-bottom:1px solid rgba(42,42,50,0.3); font-size:12px; }
  .cal-day-num { font-family:'JetBrains Mono',monospace; font-weight:600; color:var(--text-dim); }
  .cal-day-events { display:flex; flex-direction:column; gap:2px; }
  .cal-evt { display:flex; gap:4px; align-items:baseline; }
  .cal-evt-tag { font-family:'JetBrains Mono',monospace; font-size:9px; font-weight:700; padding:0 4px; border-radius:2px; white-space:nowrap; }
  .cal-evt-text { font-size:11px; color:var(--text); line-height:1.3; }
  .cal-month-card.past-month { opacity:0.45; }
  .empty-state { text-align:center; padding:48px; color:var(--text-dim); font-size:14px; }
  .add-event-btn { padding:4px 10px; border:1px solid var(--accent); border-radius:4px; background:rgba(255,107,53,0.1); color:var(--accent); font-size:12px; font-weight:600; font-family:'DM Sans',sans-serif; cursor:pointer; }
  .add-event-btn:hover { background:rgba(255,107,53,0.2); }
  .evt-actions { display:inline-flex; gap:2px; margin-left:6px; opacity:0; transition:opacity 0.1s; }
  .event-item:hover .evt-actions, .cal-evt:hover .evt-actions { opacity:1; }
  .evt-icon-btn { border:none; background:transparent; color:var(--text-dim); font-size:11px; cursor:pointer; padding:0 3px; line-height:1; }
  .evt-icon-btn:hover { color:var(--accent); }
  .evt-icon-btn.danger:hover { color:#ef4444; }
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:100; align-items:center; justify-content:center; }
  .modal-overlay.open { display:flex; }
  .modal-box { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:24px; width:420px; max-width:90vw; }
  .modal-box h2 { font-family:'JetBrains Mono',monospace; font-size:15px; color:var(--accent); margin-bottom:16px; }
  .modal-field { margin-bottom:12px; }
  .modal-field label { display:block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-dim); margin-bottom:4px; }
  .modal-field input, .modal-field select, .modal-field textarea { width:100%; padding:7px 9px; background:var(--surface2); border:1px solid var(--border); border-radius:4px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:13px; }
  .modal-field textarea { resize:vertical; min-height:60px; }
  .modal-row { display:flex; gap:8px; }
  .modal-row .modal-field { flex:1; }
  .modal-actions { display:flex; justify-content:space-between; align-items:center; margin-top:18px; }
  .modal-btn { padding:6px 14px; border-radius:4px; font-size:12px; font-weight:600; cursor:pointer; font-family:'DM Sans',sans-serif; border:1px solid var(--border); background:transparent; color:var(--text); }
  .modal-btn.primary { border-color:var(--accent); color:var(--accent); background:rgba(255,107,53,0.1); }
  .modal-btn.primary:hover { background:rgba(255,107,53,0.2); }
  .modal-btn.danger { border-color:#ef4444; color:#ef4444; background:transparent; }
  .modal-btn.danger:hover { background:rgba(239,68,68,0.1); }
  .modal-error { color:#ef4444; font-size:12px; margin-top:8px; display:none; }
  .chip-del { margin-left:6px; font-weight:400; opacity:0.6; }
  .chip-del:hover { opacity:1; color:#ef4444; }
  #printScopeLabel { display:none; }
  @media(max-width:600px) { .header,.controls,.content { padding-left:16px; padding-right:16px; } .event-row { grid-template-columns:60px 1fr; gap:8px; } }
  @media print {
    body { background:#fff; color:#000; }
    .controls, .add-event-btn, .view-toggle, .evt-actions, .modal-overlay { display:none !important; }
    .header { border-bottom-color:#000; }
    .header h1, .year-divider, .month-label, .cal-month-header { color:#000; }
    #printScopeLabel { display:block; font-size:12px; color:#444; padding:0 32px 8px; }
    .event-row.past-event { opacity:1; }
    .event-row.today-event { background:none; border-left:none; padding-left:0; }
    .month-group { break-inside:avoid; }
    .event-desc, .cal-evt-text { color:#000; }
  }
</style>
</head>
<body>
<div class="header">
  <h1>PTC 26–27 SEASON</h1>
  <span class="subtitle">Important Dates — All Productions</span>
</div>
<div class="controls" id="controls"></div>
<div id="printScopeLabel"></div>
<div class="content" id="content"></div>

<div class="modal-overlay" id="eventModal">
  <div class="modal-box">
    <h2 id="eventModalTitle">Add Event</h2>
    <input type="hidden" id="ef-id">
    <div class="modal-field">
      <label>Show</label>
      <select id="ef-show"></select>
    </div>
    <div class="modal-row">
      <div class="modal-field">
        <label>Month</label>
        <select id="ef-month"></select>
      </div>
      <div class="modal-field">
        <label>Day</label>
        <input type="number" id="ef-day" min="1" max="31">
      </div>
      <div class="modal-field">
        <label>Day End (opt.)</label>
        <input type="number" id="ef-dayend" min="1" max="31">
      </div>
    </div>
    <div class="modal-field">
      <label>Year</label>
      <input type="number" id="ef-year" min="2020" max="2100">
    </div>
    <div class="modal-field">
      <label>Description</label>
      <textarea id="ef-desc" maxlength="500"></textarea>
    </div>
    <div class="modal-error" id="eventModalError"></div>
    <div class="modal-actions">
      <button class="modal-btn danger" id="ef-delete-btn" style="display:none" onclick="deleteEventFromModal()">Delete</button>
      <span style="flex:1"></span>
      <button class="modal-btn" onclick="closeEventModal()">Cancel</button>
      <button class="modal-btn primary" onclick="submitEventForm()" style="margin-left:8px">Save</button>
    </div>
  </div>
</div>

<script>
const IS_ADMIN = {{ 'true' if is_admin else 'false' }};
// Shows now live in the season_shows DB table, not hardcoded here — loaded
// via loadShows() below so a canceled show can be deleted (and its dates
// with it) from the UI. See /api/season-shows (GET/DELETE) in app.py.
let SHOWS = [];
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTH_IDX={};MONTHS.forEach((m,i)=>MONTH_IDX[m]=i);
const TODAY=new Date();
const TODAY_KEY=TODAY.getFullYear()*10000+(TODAY.getMonth()+1)*100+TODAY.getDate();

function parseDept(desc){
  const d=desc.toLowerCase(),tags=[];
  if(/\bscenic\b/.test(d))tags.push("scenic");
  if(/\bcostume/.test(d))tags.push("costumes");
  if(/\bprop/.test(d))tags.push("props");
  if(/\blight/.test(d))tags.push("lighting");
  if(/\bsound\b|\bconsole\b|\bqlab\b/.test(d))tags.push("sound");
  if(/\baudio\b/.test(d))tags.push("audio");
  if(/\bvideo\b/.test(d))tags.push("video");
  if(/\bmakeup\b/.test(d))tags.push("makeup");
  if(/\bhair\b|\bwig/.test(d))tags.push("hair/wigs");
  if(/\bsm\b/.test(d)&&/prep|take/i.test(d))tags.push("sm");
  if(/rehearsal|tech|dress|preview|open|clos|designer run|band|sitz|wandel|meet|strike|load.in|focus|spacing|gala|camp|new works/i.test(d))tags.push("production");
  if(!tags.length)tags.push("production");
  return tags;
}

// ── Events now live in the season_events DB table, not hardcoded here.
// Loaded via loadEvents() below; see /api/season-events (GET/POST/PUT/DELETE)
// in app.py. Migrated 2026-08-13 from the old hardcoded add("show",year,[...])
// calls so the calendar can be edited from the UI instead of git.
let EVENTS=[];

async function apiCall(method,url,body){
  const opts={method,headers:{'Content-Type':'application/json'}};
  if(body!==undefined) opts.body=JSON.stringify(body);
  const res=await fetch(url,opts);
  if(res.status===401){window.location='/login';return null;}
  let payload=null;
  try{payload=await res.json();}catch(e){}
  if(!res.ok){throw new Error((payload&&payload.error)||('Server error: '+res.status));}
  return payload;
}

async function loadShows(){
  const rows=await apiCall('GET','/api/season-shows');
  SHOWS=rows||[];
}

async function loadEvents(){
  const rows=await apiCall('GET','/api/season-events');
  EVENTS=(rows||[]).map(r=>({
    id:r.id, show:r.show_id, year:r.year, month:r.month, day:r.day,
    dayEnd:r.day_end||null, desc:r.desc,
    depts:parseDept(r.desc),
    sortKey:r.year*10000+(MONTH_IDX[r.month]+1)*100+r.day,
  }));
  EVENTS.sort((a,b)=>a.sortKey-b.sortKey);
}

let activeShows=new Set();
let activeDepts=new Set(["all"]);
let viewMode="timeline";

function getShowInfo(id){return SHOWS.find(s=>s.id===id);}

function filterEvents(){
  return EVENTS.filter(e=>{
    if(!activeShows.has(e.show))return false;
    if(!activeDepts.has("all")){
      return e.depts.some(d=>{
        if(activeDepts.has("audio")&&(d==="audio"||d==="sound"))return true;
        if(activeDepts.has("sound")&&(d==="audio"||d==="sound"))return true;
        return activeDepts.has(d);
      });
    }
    return true;
  });
}

function getDow(year,month,day){
  const d=new Date(year,MONTH_IDX[month],day);
  return["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()];
}

function renderControls(){
  const c=document.getElementById("controls");
  let html='<label>Shows</label>';
  SHOWS.forEach(s=>{
    const active=activeShows.has(s.id)?"active":"";
    const delBtn=IS_ADMIN?`<span class="chip-del" title="Cancel/delete this show" onclick="event.stopPropagation();deleteShow('${s.id}')">&times;</span>`:'';
    html+=`<span class="show-chip ${active}" style="color:${s.color};border-color:${s.color};background:${active?s.bg:'transparent'}" onclick="toggleShow('${s.id}')">${s.short}${delBtn}</span>`;
  });
  html+='<span style="width:12px"></span><label>Dept</label>';
  const dl={all:"All",audio:"Audio",lighting:"LX",scenic:"Scenic",costumes:"Cost",props:"Props",video:"Video","hair/wigs":"H/W",sm:"SM",production:"Prod"};
  Object.entries(dl).forEach(([k,v])=>{
    html+=`<button class="filter-btn ${activeDepts.has(k)?'active':''}" onclick="setDept('${k}')">${v}</button>`;
  });
  html+='<span class="view-toggle">';
  if(IS_ADMIN) html+=`<button class="add-event-btn" onclick="openAddModal()">+ Add Event</button>`;
  html+=`<button class="filter-btn" onclick="printCalendar()" title="Print the shows currently selected above">Print</button>`;
  html+=`<button class="filter-btn ${viewMode==='timeline'?'active':''}" onclick="setView('timeline')">Timeline</button>`;
  html+=`<button class="filter-btn ${viewMode==='grid'?'active':''}" onclick="setView('grid')">Grid</button>`;
  html+='</span>';
  c.innerHTML=html;
}

async function deleteShow(id){
  const s=getShowInfo(id);
  if(!s)return;
  const count=EVENTS.filter(e=>e.show===id).length;
  if(!confirm(`Delete "${s.name}" and its ${count} date(s) from the calendar? This can't be undone.`))return;
  try{
    await apiCall('DELETE','/api/season-shows/'+id);
    activeShows.delete(id);
    await loadShows();
    await loadEvents();
    render();
  }catch(err){
    alert(err.message||"Delete failed.");
  }
}

function printCalendar(){
  const selected=SHOWS.filter(s=>activeShows.has(s.id)).map(s=>s.name);
  document.getElementById("printScopeLabel").textContent=
    selected.length?("Filtered to: "+selected.join(", ")):"All shows / no filter applied";
  window.print();
}

function toggleShow(id){if(activeShows.has(id))activeShows.delete(id);else activeShows.add(id);render();}
function setDept(d){
  if(d==="all"){activeDepts=new Set(["all"]);}
  else{
    activeDepts.delete("all");
    if(activeDepts.has(d))activeDepts.delete(d);else activeDepts.add(d);
    if(activeDepts.size===0)activeDepts=new Set(["all"]);
  }
  render();
}
function setView(v){viewMode=v;render();}

function renderTimeline(events){
  if(!events.length)return'<div class="empty-state">No events match filters</div>';
  let html='',lastYear=null,lastYM=null;
  events.forEach(e=>{
    const ymKey=e.year+"-"+e.month;
    if(e.year!==lastYear){lastYear=e.year;html+=`<div class="year-divider">${e.year}</div>`;}
    if(ymKey!==lastYM){if(lastYM)html+='</div>';lastYM=ymKey;html+=`<div class="month-group"><div class="month-label">${e.month}<span class="ml-year">${e.year}</span></div>`;}
    const dk=e.dayEnd?`${e.day}–${e.dayEnd}`:`${e.day}`;
    const dow=getDow(e.year,e.month,e.day);
    const evKey=e.year*10000+(MONTH_IDX[e.month]+1)*100+e.day;
    let rc="event-row";
    if(evKey<TODAY_KEY)rc+=" past-event";
    if(evKey===TODAY_KEY)rc+=" today-event";
    const s=getShowInfo(e.show);
    const dt=e.depts.map(d=>`<span class="dept-tag" data-dept="${d}">${d}</span>`).join('');
    const actions=IS_ADMIN?`<span class="evt-actions"><button class="evt-icon-btn" title="Edit" onclick="openEditModal(${e.id})">&#9998;</button><button class="evt-icon-btn danger" title="Delete" onclick="quickDeleteEvent(${e.id})">&times;</button></span>`:'';
    html+=`<div class="${rc}"><div class="event-date">${dk} <span class="ed-dow">${dow}</span></div><div class="event-items"><div class="event-item"><span class="event-show-tag" style="color:${s.color};background:${s.bg}">${s.short}</span><span class="event-desc">${e.desc}</span>${dt}${actions}</div></div></div>`;
  });
  if(lastYM)html+='</div>';
  return html;
}

function renderGrid(events){
  if(!events.length)return'<div class="empty-state">No events match filters</div>';
  const grouped={};
  events.forEach(e=>{
    const key=e.year+"-"+e.month;
    if(!grouped[key])grouped[key]={year:e.year,month:e.month,days:{}};
    const dk=e.dayEnd?`${e.day}–${e.dayEnd}`:`${e.day}`;
    if(!grouped[key].days[dk])grouped[key].days[dk]=[];
    grouped[key].days[dk].push(e);
  });
  let html='<div class="cal-grid">';
  const keys=Object.keys(grouped).sort((a,b)=>{
    const[ay,am]=a.split("-");const[by,bm]=b.split("-");
    return(parseInt(ay)*12+MONTH_IDX[am])-(parseInt(by)*12+MONTH_IDX[bm]);
  });
  const nowYM=TODAY.getFullYear()*12+TODAY.getMonth();
  keys.forEach(key=>{
    const g=grouped[key];
    const cardYM=g.year*12+MONTH_IDX[g.month];
    const pc=cardYM<nowYM?" past-month":"";
    html+=`<div class="cal-month-card${pc}"><div class="cal-month-header">${g.month} ${g.year}</div><div class="cal-month-body">`;
    Object.keys(g.days).sort((a,b)=>parseInt(a)-parseInt(b)).forEach(dk=>{
      html+=`<div class="cal-day"><div class="cal-day-num">${dk}</div><div class="cal-day-events">`;
      g.days[dk].forEach(ev=>{
        const s=getShowInfo(ev.show);
        const actions=IS_ADMIN?`<span class="evt-actions"><button class="evt-icon-btn" title="Edit" onclick="openEditModal(${ev.id})">&#9998;</button><button class="evt-icon-btn danger" title="Delete" onclick="quickDeleteEvent(${ev.id})">&times;</button></span>`:'';
        html+=`<div class="cal-evt"><span class="cal-evt-tag" style="color:${s.color};background:${s.bg}">${s.short}</span><span class="cal-evt-text">${ev.desc}</span>${actions}</div>`;
      });
      html+='</div></div>';
    });
    html+='</div></div>';
  });
  html+='</div>';
  return html;
}

function render(){renderControls();const events=filterEvents();document.getElementById("content").innerHTML=viewMode==="timeline"?renderTimeline(events):renderGrid(events);}

// ── Admin edit UI (add/edit/delete events) ──────────────────────────

function populateModalSelects(){
  const showSel=document.getElementById("ef-show");
  showSel.innerHTML=SHOWS.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
  const monthSel=document.getElementById("ef-month");
  monthSel.innerHTML=MONTHS.map(m=>`<option value="${m}">${m}</option>`).join('');
}

function openAddModal(){
  document.getElementById("eventModalTitle").textContent="Add Event";
  document.getElementById("ef-id").value="";
  document.getElementById("ef-show").value=SHOWS[0].id;
  document.getElementById("ef-month").value=MONTHS[TODAY.getMonth()];
  document.getElementById("ef-day").value=TODAY.getDate();
  document.getElementById("ef-dayend").value="";
  document.getElementById("ef-year").value=TODAY.getFullYear();
  document.getElementById("ef-desc").value="";
  document.getElementById("ef-delete-btn").style.display="none";
  document.getElementById("eventModalError").style.display="none";
  document.getElementById("eventModal").classList.add("open");
}

function openEditModal(id){
  const e=EVENTS.find(ev=>ev.id===id);
  if(!e)return;
  document.getElementById("eventModalTitle").textContent="Edit Event";
  document.getElementById("ef-id").value=e.id;
  document.getElementById("ef-show").value=e.show;
  document.getElementById("ef-month").value=e.month;
  document.getElementById("ef-day").value=e.day;
  document.getElementById("ef-dayend").value=e.dayEnd||"";
  document.getElementById("ef-year").value=e.year;
  document.getElementById("ef-desc").value=e.desc;
  document.getElementById("ef-delete-btn").style.display="inline-block";
  document.getElementById("eventModalError").style.display="none";
  document.getElementById("eventModal").classList.add("open");
}

function closeEventModal(){document.getElementById("eventModal").classList.remove("open");}

function showModalError(msg){
  const el=document.getElementById("eventModalError");
  el.textContent=msg;
  el.style.display="block";
}

async function submitEventForm(){
  const id=document.getElementById("ef-id").value;
  const payload={
    show:document.getElementById("ef-show").value,
    month:document.getElementById("ef-month").value,
    day:parseInt(document.getElementById("ef-day").value,10),
    day_end:document.getElementById("ef-dayend").value?parseInt(document.getElementById("ef-dayend").value,10):null,
    year:parseInt(document.getElementById("ef-year").value,10),
    desc:document.getElementById("ef-desc").value.trim(),
  };
  if(!payload.desc){showModalError("Description is required.");return;}
  try{
    if(id) await apiCall('PUT','/api/season-events/'+id,payload);
    else await apiCall('POST','/api/season-events',payload);
    closeEventModal();
    await loadEvents();
    render();
  }catch(err){
    showModalError(err.message||"Save failed.");
  }
}

async function deleteEventFromModal(){
  const id=document.getElementById("ef-id").value;
  if(!id)return;
  if(!confirm("Delete this event? This can't be undone."))return;
  try{
    await apiCall('DELETE','/api/season-events/'+id);
    closeEventModal();
    await loadEvents();
    render();
  }catch(err){
    showModalError(err.message||"Delete failed.");
  }
}

async function quickDeleteEvent(id){
  if(!confirm("Delete this event? This can't be undone."))return;
  try{
    await apiCall('DELETE','/api/season-events/'+id);
    await loadEvents();
    render();
  }catch(err){
    alert(err.message||"Delete failed.");
  }
}

async function init(){
  await loadShows();
  populateModalSelects();
  await loadEvents();
  render();
}
init();
</script>
</body>
</html>
