<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PTC Audio — Home</title>
<style>
:root{--bk:#0a0a0a;--red:#E82C2A;--grey:#888}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:#111;color:#eee;font:17.5px/1.35 -apple-system,Segoe UI,Helvetica,Arial,sans-serif;display:flex;flex-direction:column}
#top{background:var(--bk);border-bottom:3px solid var(--red);padding:10px 25px;display:flex;align-items:center;gap:15px;flex-wrap:wrap;flex:0 0 auto}
#top b{font-size:21px;letter-spacing:1px}#top .r{color:var(--red)}
#mode{margin-left:auto;display:flex;gap:0;border:1px solid #333;border-radius:6px;overflow:hidden}
#mode div{padding:5px 15px;font-size:15px;cursor:pointer;color:#aaa}#mode div.on{background:var(--red);color:#fff}
#crumb{padding:7.5px 25px;color:var(--grey);font-size:16px;flex:0 0 auto}#crumb a{color:var(--red);text-decoration:none;cursor:pointer}
#stage{padding:0 25px 15px;max-width:1375px;margin:0 auto;width:100%;flex:1 1 auto;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:12.5px;margin-top:7.5px}
.tile{background:#1c1c1c;border:1px solid #2c2c2c;border-left:5px solid var(--red);border-radius:8px;padding:12.5px 15px;cursor:pointer;transition:.12s}
.tile:hover{background:#262626;transform:translateY(-2px)}
.tile b{display:block;font-size:18px}.tile span{color:var(--grey);font-size:15px}
a.tile{display:block;color:#eee;text-decoration:none}
.card{background:#1c1c1c;border:1px solid #2c2c2c;border-radius:8px;padding:15px 20px;margin-top:12.5px}
.card h2{margin:0 0 10px;font-size:20px;border-bottom:2px solid var(--red);padding-bottom:6px}
table{border-collapse:collapse;width:100%;font-size:16px}
td{padding:5px 12.5px;border-bottom:1px solid #2a2a2a;vertical-align:top}
td:first-child{color:var(--grey);white-space:nowrap;width:38%}
td:last-child{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15.5px}
.warn{background:#2a1414;border-left:4px solid var(--red);padding:7.5px 15px;margin-top:10px;font-size:15.5px;border-radius:0 6px 6px 0}
.note{background:#1d1d14;border-left:4px solid #c9a227;padding:7.5px 15px;margin-top:10px;font-size:15.5px;border-radius:0 6px 6px 0}
.card ol{padding-left:25px}.card li{margin:5px 0}
.card a{color:var(--red)}
#q{width:100%;max-width:500px;margin:10px 0 2.5px;padding:8.5px 15px;font-size:17.5px;background:#1c1c1c;border:1px solid #333;border-radius:6px;color:#fff}
#foot{padding:7.5px 25px;color:#666;font-size:14px;text-align:center;flex:0 0 auto}
.sec{color:var(--red);font-weight:700;margin:17.5px 0 0;font-size:15px;letter-spacing:1.5px}
#jessBtn{position:fixed;right:22px;bottom:22px;background:var(--red);color:#fff;border:none;border-radius:30px;padding:13px 22px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:50;letter-spacing:.3px}
#jessBtn:hover{background:#ff3b39}
#jessPanel{position:fixed;right:22px;bottom:78px;width:380px;max-width:calc(100vw - 44px);height:min(520px,70vh);background:#161616;border:1px solid #333;border-top:3px solid var(--red);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.5);display:none;flex-direction:column;overflow:hidden;z-index:50}
#jessPanel.open{display:flex}
#jessHead{padding:10px 14px;border-bottom:1px solid #2c2c2c;display:flex;align-items:center;gap:8px;flex:0 0 auto}
#jessHead b{font-size:15px}
#jessHead .r{color:var(--red)}
#jessModeSel{margin-left:auto;display:flex;border:1px solid #333;border-radius:5px;overflow:hidden;font-size:11.5px}
#jessModeSel div{padding:3px 8px;cursor:pointer;color:#999}
#jessModeSel div.on{background:var(--red);color:#fff}
#jessPop,#jessClose{cursor:pointer;color:#888;font-size:16px;padding:0 4px;flex:0 0 auto}
#jessClose{font-size:18px}
#jessLog{flex:1 1 auto;overflow-y:auto;padding:12px 14px;font-size:14.5px;line-height:1.42}
.jmsg{margin-bottom:14px}
.jmsg .who{font-size:11px;letter-spacing:.5px;color:#777;margin-bottom:3px;text-transform:uppercase}
.jmsg.q .who{color:var(--red)}
.jmsg .body{white-space:pre-wrap}
.jmsg.err .body{color:#ff8080}
.jmsg.pending .body{color:#888;font-style:italic}
#jessRow{flex:0 0 auto;border-top:1px solid #2c2c2c;padding:10px;display:flex;gap:8px}
#jessQ{flex:1;background:#1c1c1c;border:1px solid #333;border-radius:6px;color:#fff;padding:8px 10px;font-size:14.5px}
#jessSend{background:var(--red);color:#fff;border:none;border-radius:6px;padding:0 14px;cursor:pointer;font-weight:700}
#jessSend:disabled{opacity:.5;cursor:default}
/* Search box + Ask Jess hidden for now — dialing in relevance was eating
   time better spent on the foundation. Code left intact underneath so it's
   a one-line revert (delete this rule) rather than a rebuild. */
#q,#jessBtn,#jessPanel{display:none !important}
</style></head><body>
<div id="top"><b>PTC <span class="r">AUDIO</span></b><span style="color:#888;font-size:13px">department home · The Phoenix Theatre Company</span>
<div id="mode"><div id="mStaff" onclick="setMode('staff')">STAFF</div><div id="mGuest" onclick="setMode('guest')">GUEST</div></div></div>
<div id="crumb"></div><div id="stage"></div>
<div id="foot">Matthew Gibney · Audio Supervisor · m.gibney@phoenixtheatre.com — facts current as of 2026-07-09</div>

<button id="jessBtn" onclick="jessToggle()">💬 Ask Jess</button>
<div id="jessPanel">
 <div id="jessHead"><b>Ask <span class="r">Jess</span></b>
  <span style="margin-left:auto;color:#777;font-size:10px;letter-spacing:.5px">KB SEARCH</span>
  <span id="jessClose" onclick="jessToggle()">✕</span></div>
 <div id="jessLog"><div class="jmsg"><div class="who">jess</div><div class="body">Search the Knowledge Base — gear, network, procedures, shows, budget. Type a keyword or two and hit enter.</div></div></div>
 <div id="jessRow"><input id="jessQ" placeholder="search the KB…" onkeydown="if(event.key==='Enter')jessAsk()"><button id="jessSend" onclick="jessAsk()">Search</button></div>
</div>

<script>
function jessToggle(){
 document.getElementById('jessPanel').classList.toggle('open')}

function jessAppend(who,text,cls){const log=document.getElementById('jessLog');
 const div=document.createElement('div');div.className='jmsg '+(cls||'');
 div.innerHTML=`<div class="who">${who}</div><div class="body"></div>`;
 div.querySelector('.body').textContent=text;
 log.appendChild(div);log.scrollTop=log.scrollHeight;return div}

function jessAppendResults(pages,q){const log=document.getElementById('jessLog');
 const div=document.createElement('div');div.className='jmsg';
 const who=document.createElement('div');who.className='who';who.textContent='jess';
 const body=document.createElement('div');body.className='body';
 if(!pages.length){
  body.textContent='No KB pages matched "'+q+'".';
 } else {
  pages.forEach(p=>{
   const wrap=document.createElement('div');
   wrap.style.margin='0 0 12px';
   const a=document.createElement('a');
   a.href='/kb/'+p.slug;
   a.style.display='block';
   a.style.color='var(--red)';
   a.style.textDecoration='none';
   a.style.fontWeight='600';
   a.textContent=(p.section?'['+p.section+'] ':'')+p.title;
   wrap.appendChild(a);
   if(p.snippet){
    const s=document.createElement('div');
    s.style.color='#aaa';
    s.style.fontSize='13px';
    s.style.marginTop='2px';
    s.textContent=p.snippet;
    wrap.appendChild(s);
   }
   body.appendChild(wrap);
  });
 }
 div.appendChild(who);div.appendChild(body);
 log.appendChild(div);log.scrollTop=log.scrollHeight;return div}

async function jessAsk(){const inp=document.getElementById('jessQ');const q=inp.value.trim();if(!q)return;
 inp.value='';document.getElementById('jessSend').disabled=true;
 jessAppend('you',q,'q');
 const pending=jessAppend('jess','searching…','pending');
 try{
  const res=await fetch('/api/kb/search?q='+encodeURIComponent(q));
  if(!res.ok){pending.remove();jessAppend('jess','Search failed ('+res.status+').','err')}
  else{
   const pages=await res.json();
   pending.remove();
   jessAppendResults(pages,q);
  }
 }catch(e){
  pending.remove();
  jessAppend('jess','Search failed — try again.','err');
 }
 document.getElementById('jessSend').disabled=false}
</script>
<script>
/* STAFF/GUEST venue fact data is now database-backed (venues + venue_systems
   tables, editable at /admin/venues) rather than hardcoded here — server
   injects the exact same nested shape the rendering code below already
   expects, so sec()/venue()/card()/home() need zero changes. The original
   hardcoded snapshot this was seeded from lives in seed_data/*.json and in
   git history if it's ever needed for reference. */
const STAFF = {{ staff_data|tojson }};
const GUEST = {{ guest_data|tojson }};
/* ===== documents / tools / procedures (staff unless noted) ===== */
const DOCS=[
 ["Riders (external-ready)",[["Stephenson Audio System Rider v1.2","/docs/Riders/Stephenson_Audio_System_Rider_v1.2.pdf",1],["Hormel Audio System Rider v1.0","/docs/Riders/Hormel_Audio_System_Rider_v1.0.pdf",1]]],
 ["System guides",[["Hormel System Reference Guide v1.3","/docs/System-Guides/Hormel_System_Reference_Guide_v1.3.pdf",0],["Hormel Network Signal Flow","/docs/System-Guides/Hormel_Network_Signal_Flow_v1.0.pdf",0],["Hormel CL5 MIDI Remote Addendum","/docs/System-Guides/Hormel_CL5_MIDI_Remote_Control_Addendum_v1.0.pdf",0],["RIVAGEPM Show-File Teardown","/docs/System-Guides/Inside_the_Show_File_RIVAGEPM_Teardown.pdf",0]]],
 ["Network",[["Audio Network Big Picture v1.0","/docs/Network/PTC_Audio_Network_Big_Picture_v1.0.pdf",0],["Switch-by-Switch Reference v2.0","/docs/Network/PTC_Audio_Switch_By_Switch_v2.0.pdf",0],["Stephenson Designer IP Quick Sheet v1.3","/docs/Network/Stephenson_Designer_IP_QuickSheet_v1.3.pdf",0],["Arcadia System Map v1.1","/docs/Network/Arcadia_System_Map_by_Space_v1.1.pdf",0]]],
 ["Budget & reports",[["Season Supply Budget Analysis","/docs/Budget/Season_Supply_Budget_Analysis.pdf",0],["MS26 Sound Spend Report","/docs/Budget/MS26_Sound_Spend_Report.pdf",0],["Band Mic Usage Comparison","/docs/Budget/Band_Mic_Usage_Comparison.pdf",0]]],
 ["Incidents",[["PM5 DSP Incident Report v1.1 2026-07-10","/docs/Incidents/PM5_DSP_Incident_Report_v1.1_2026-07-10.pdf",0]]]];
// Server-supplied: true only for admin accounts (see /home route in app.py).
const IS_ADMIN = {{ 'true' if is_admin else 'false' }};
// General office links — every logged-in staff account authenticates separately
// with these services in their own browser session; this app never sees or
// passes along Microsoft/Tallie credentials, it's just a bookmark.
const ADMIN=[["Outlook Mail","https://outlook.cloud.microsoft/mail/"],["Tallie Expense Reports","https://usetallie.com/x9/Expense/Tile"]];
// Infra/admin-only links — only shown to admin accounts.
const ADMIN_ONLY=[["Manage Users","/admin/users"],["Manage Venue Data","/admin/venues"],["Render Dashboard","https://dashboard.render.com/"],["Chrome Remote Desktop","https://remotedesktop.google.com/access/"]];
const TOOLS=[["Task Manager","/tasks"],["Knowledge Base","/kb"],["Inventory","/tools/inventory"],["QuoteBuilder","/tools/quotebuilder"],["Season Calendar","/tools/season-calendar"],["CL5 Patch Generator","/tools/cl5-patch-generator"],["Lens Throw Calculator","/tools/lens-throw-calculator"]];
/* ===== app ===== */
const COLORS={venues:'#E82C2A',tools:'#2C9BE8',admin:'#C9A227',docs:'#E8892C'};
function sec(label,color){return `<div class="sec" style="color:${color}">${label}</div>`}
let MODE=localStorage.getItem('ptcMode')||'staff';
const crumb=document.getElementById('crumb'),stage=document.getElementById('stage');
function setMode(m){MODE=m;localStorage.setItem('ptcMode',m);home()}
function db(){return MODE==='staff'?STAFF:GUEST}
function home(){
 // home() fully replaces #stage, including the #q search box itself — if
 // that happens while the user is mid-keystroke (doSearch calls home() for
 // any query under 2 chars), the box gets destroyed and recreated, which
 // wipes focus and the just-typed character. Capture and restore state
 // across the rebuild so typing doesn't get interrupted.
 const prevQ = document.getElementById('q');
 const hadFocus = prevQ && document.activeElement === prevQ;
 const prevVal = prevQ ? prevQ.value : '';
 const prevSel = prevQ ? [prevQ.selectionStart, prevQ.selectionEnd] : null;

 document.getElementById('mStaff').classList.toggle('on',MODE==='staff');
 document.getElementById('mGuest').classList.toggle('on',MODE==='guest');
 crumb.innerHTML='<a onclick="home()">Home</a>';
 let h='<input id="q" placeholder="search everything…" oninput="doSearch(this.value)">';
 h+=sec('VENUES & SYSTEMS',COLORS.venues)+'<div class="grid">'+Object.keys(db()).map(v=>`<div class="tile" style="border-left-color:${COLORS.venues}" onclick="venue('${v}')"><b>${v}</b><span>${db()[v]._d}</span></div>`).join('')+'</div>';
 if(MODE==='staff'){
  h+=sec('TOOLS',COLORS.tools)+'<div class="grid">'+TOOLS.map(t=>`<a class="tile" style="border-left-color:${COLORS.tools}" href="${t[1]}" target="_blank"><b>${t[0]}</b><span>opens in new tab</span></a>`).join('')+'</div>';
  h+=sec('ADMIN',COLORS.admin)+'<div class="grid">'+ADMIN.map(t=>`<a class="tile" style="border-left-color:${COLORS.admin}" href="${t[1]}" target="_blank"><b>${t[0]}</b><span>opens in new tab</span></a>`).join('')+'</div>';
  if(IS_ADMIN){
   h+=sec('ADMIN ONLY',COLORS.admin)+'<div class="grid">'+ADMIN_ONLY.map(t=>`<a class="tile" style="border-left-color:${COLORS.admin}" href="${t[1]}" target="_blank"><b>${t[0]}</b><span>opens in new tab</span></a>`).join('')+'</div>';
  }
  h+=sec('DOCUMENTS',COLORS.docs)+`<div class="grid"><div class="tile" style="border-left-color:${COLORS.docs}" onclick="docs()"><b>📄 Documents</b><span>${DOCS.reduce((n,g)=>n+g[1].length,0)} files · browse all</span></div></div>`;
 } else {
  h+=sec('DOCUMENTS',COLORS.docs)+`<div class="grid"><div class="tile" style="border-left-color:${COLORS.docs}" onclick="docs()"><b>📄 Documents</b><span>${DOCS.filter(g=>g[1].some(d=>d[2])).reduce((n,g)=>n+g[1].filter(d=>d[2]).length,0)} files · browse all</span></div></div>`;
 }
 stage.innerHTML=h;

 if(hadFocus){
  const q=document.getElementById('q');
  q.value=prevVal;
  q.focus();
  if(prevSel) q.setSelectionRange(prevSel[0],prevSel[1]);
 }
}
function docs(){crumb.innerHTML='<a onclick="home()">Home</a> › <b style="color:#eee">Documents</b>';
 const list=MODE==='staff'?DOCS:DOCS.filter(g=>g[1].some(d=>d[2]));
 stage.innerHTML=list.map(g=>{const items=MODE==='staff'?g[1]:g[1].filter(d=>d[2]);
  return `<div class="card" style="border-top:2px solid ${COLORS.docs}"><h2 style="border-bottom-color:${COLORS.docs}">${g[0]}</h2>${items.map(d=>`<a class="tile" style="border:none;padding:6px 0" href="${d[1]}" target="_blank">📄 ${d[0]}</a>`).join('')}</div>`}).join('')}
function venue(v){crumb.innerHTML=`<a onclick="home()">Home</a> › <b style="color:#eee">${v}</b>`;
 const systems=Object.keys(db()[v]).filter(k=>k!=='_d');
 let h=`<div style="margin:7.5px 0 2.5px"><b style="font-size:23px">${v}</b><span style="color:var(--grey);font-size:15px;margin-left:10px">${db()[v]._d}</span></div>`;
 h+=systems.map(s=>card(v,s,true)).join('');
 stage.innerHTML=h}
function card(v,s,short){const d=db()[v][s];
 return `<div class="card"><h2>${short?s:v+' — '+s}</h2><table>${d.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`+
 (MODE==='staff'?d.warns.map(w=>`<div class="warn">⚠ ${w}</div>`).join(''):'')+
 d.notes.map(n=>`<div class="note">${n}</div>`).join('')+`</div>`}
function doSearch(t){t=t.trim().toLowerCase();if(t.length<2){home();return}
 let out='';const D=db();
 for(const v in D)for(const s in D[v]){if(s==='_d')continue;const d=D[v][s];
  const blob=(s+' '+d.rows.flat().join(' ')+' '+(MODE==='staff'?d.warns.join(' '):'')+' '+d.notes.join(' ')).toLowerCase();
  if(t.split(/\s+/).every(x=>blob.includes(x)))out+=card(v,s)}
 stage.querySelectorAll('.card,.grid,.sec').forEach(e=>e.remove());
 stage.insertAdjacentHTML('beforeend',out||'<div class="card">no matches</div>')}
home();
</script></body></html>
