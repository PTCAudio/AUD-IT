<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUD-IT Tasks — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=Lora:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0e0e;--sur:#161616;--pan:#1e1e1e;--b1:#2e2e2e;--b2:#3e3e3e;--txt:#e8e4e0;--mut:#888078;--wht:#f8f4f0;--red:#c8102e;--rlt:#e8394f}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:'Lora',Georgia,serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-box{background:var(--sur);border:1px solid var(--b1);border-top:4px solid var(--red);border-radius:6px;padding:40px 36px;width:360px;max-width:90vw;text-align:center}
.login-title{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:.12em;color:var(--wht);margin-bottom:4px}
.login-sub{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.2em;color:var(--red);text-transform:uppercase;margin-bottom:24px}
.login-input{width:100%;font-family:'DM Mono',monospace;font-size:14px;padding:12px 16px;border:1px solid var(--b2);border-radius:4px;background:var(--pan);color:var(--txt);outline:none;text-align:center;letter-spacing:.05em;margin-bottom:16px}
.login-input:focus{border-color:var(--red)}
.login-input::placeholder{color:var(--mut)}
.login-btn{width:100%;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.08em;padding:12px;border:none;border-radius:4px;background:var(--red);color:#fff;cursor:pointer;transition:background .15s;text-transform:uppercase}
.login-btn:hover{background:var(--rlt)}
.msg{font-family:'DM Mono',monospace;font-size:11px;color:var(--txt);margin-bottom:16px;line-height:1.6}
.login-footer{font-family:'DM Mono',monospace;font-size:9px;color:var(--mut);margin-top:20px;letter-spacing:.05em}
.login-footer a{color:var(--mut)}
</style>
</head>
<body>
<div class="login-box">
  <div class="login-title">AUD-IT Tasks</div>
  <div class="login-sub">Reset Password</div>
  {% if message %}
  <div class="msg">{{ message }}</div>
  {% else %}
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="email" name="email" class="login-input" placeholder="Your email" autofocus autocomplete="username">
    <button type="submit" class="login-btn">Send Reset Link</button>
  </form>
  {% endif %}
  <div class="login-footer"><a href="{{ url_for('login') }}">Back to login</a></div>
</div>
</body>
</html>
