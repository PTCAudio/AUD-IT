{% extends "shell.html" %}
{% block title %}{{ page.title }}{% endblock %}

{% block head %}
<style>
#kb-main{padding:20px 24px;max-width:820px;margin:0 auto}
.kb-crumb{font-family:var(--mono);font-size:9px;color:var(--mut);margin-bottom:10px}
.kb-crumb a{color:var(--mut);text-decoration:none}
.kb-crumb a:hover{color:var(--red)}
.view-title{font-family:var(--disp);font-size:26px;letter-spacing:.04em;color:var(--wht);margin-bottom:4px}
.view-sub{font-family:var(--mono);font-size:9px;color:var(--mut);letter-spacing:.05em;margin-bottom:20px}
.kb-body{color:var(--txt);font-size:14px;line-height:1.6}
.kb-body h1,.kb-body h2,.kb-body h3{color:var(--wht);margin:20px 0 8px}
.kb-body h1{font-size:20px}.kb-body h2{font-size:17px}.kb-body h3{font-size:14px}
.kb-body p{margin:10px 0}
.kb-body a{color:var(--red)}
.kb-body code{font-family:var(--mono);font-size:12px;background:var(--pan);padding:1px 5px;border-radius:2px}
.kb-body pre{background:var(--pan);border:1px solid var(--b1);border-radius:4px;padding:12px;overflow-x:auto}
.kb-body pre code{background:none;padding:0}
.kb-body table{border-collapse:collapse;width:100%;margin:12px 0;font-size:12px}
.kb-body td,.kb-body th{padding:6px 10px;border:1px solid var(--b1);text-align:left}
.kb-body ul,.kb-body ol{padding-left:22px;margin:10px 0}
</style>
{% endblock %}

{% block content %}
<div id="kb-main">
  <div class="kb-crumb"><a href="{{ url_for('kb_index') }}">&larr; Knowledge Base</a></div>
  <div class="view-title">{{ page.title }}</div>
  <div class="view-sub">{{ page.section or 'General' }} &middot; updated {{ page.updated_at }}</div>
  <div class="kb-body">{{ body_html | safe }}</div>
</div>
{% endblock %}
