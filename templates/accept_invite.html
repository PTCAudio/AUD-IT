<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUD-IT Tasks — Accept Invite</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=Lora:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0e0e;--sur:#161616;--pan:#1e1e1e;--b1:#2e2e2e;--b2:#3e3e3e;--txt:#e8e4e0;--mut:#888078;--wht:#f8f4f0;--red:#c8102e;--rdm:#8a0a1e;--rlt:#e8394f}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:'Lora',Georgia,serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-box{background:var(--sur);border:1px solid var(--b1);border-top:4px solid var(--red);border-radius:6px;padding:40px 36px;width:380px;max-width:90vw;text-align:center}
.login-title{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:.12em;color:var(--wht);margin-bottom:4px}
.login-sub{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.2em;color:var(--red);text-transform:uppercase;margin-bottom:20px}
.welcome{font-size:14px;color:var(--txt);margin-bottom:20px}
.login-input{width:100%;font-family:'DM Mono',monospace;font-size:14px;padding:12px 16px;border:1px solid var(--b2);border-radius:4px;background:var(--pan);color:var(--txt);outline:none;text-align:center;letter-spacing:.05em;margin-bottom:14px}
.login-input:focus{border-color:var(--red)}
.login-input::placeholder{color:var(--mut)}
.login-btn{width:100%;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.08em;padding:12px;border:none;border-radius:4px;background:var(--red);color:#fff;cursor:pointer;transition:background .15s;text-transform:uppercase}
.login-btn:hover{background:var(--rlt)}
.login-error{font-family:'DM Mono',monospace;font-size:10px;color:var(--rlt);margin-bottom:12px}
.hint{font-family:'DM Mono',monospace;font-size:9px;color:var(--mut);margin-top:16px;letter-spacing:.05em}
</style>
</head>
<body>
<div class="login-box">
  <div class="login-title">AUD-IT Tasks</div>
  <div class="login-sub">Phoenix Theatre Company — Audio Department</div>
  <div class="welcome">Welcome, {{ invite.name }}. Set a password to activate your account for {{ invite.email }}.</div>
  {% if error %}
  <div class="login-error">{{ error }}</div>
  {% endif %}
  <form method="POST">
    <input type="password" name="password" class="login-input" placeholder="New password" autofocus autocomplete="new-password">
    <input type="password" name="confirm" class="login-input" placeholder="Confirm password" autocomplete="new-password">
    <button type="submit" class="login-btn">Activate Account</button>
  </form>
  <div class="hint">At least 10 characters, with an uppercase letter, a lowercase letter, a number, and a special character.</div>
</div>
</body>
</html>
